services:
  db:
    image: postgres:15-alpine
    container_name: guiamx-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: guiamx
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: guiamx-api
    restart: always
    user: root
    working_dir: /app
    environment:
      DATABASE_URL: "postgresql://user:password@db:5432/guiamx?schema=public"
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app:z
      - /app/node_modules
    command: sh -c "bunx --bun prisma migrate dev --name init && bunx --bun prisma generate && bun run scripts/seed-all.ts && bun run dev"
    depends_on:
      - db

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: guiamx-web
    restart: always
    user: root
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app:z
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  postgres_data:
