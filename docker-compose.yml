services:
  db:
    image: postgres:15-alpine
    container_name: guiamx-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: guiamx
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: guiamx-api
    restart: always
    user: root
    working_dir: /app
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}
      PROJECT_ENDPOINT: ${PROJECT_ENDPOINT}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app:z
      - /app/node_modules
    command: sh -c "bunx --bun prisma migrate dev --name init && bunx --bun prisma generate && bun run scripts/seed-all.ts && bun --env-file=.env run dev"
    depends_on:
      - db

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: guiamx-web
    restart: always
    user: root
    working_dir: /app
    env_file: .env
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      INTERNAL_API_URL: ${INTERNAL_API_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app:z
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  postgres_data:
